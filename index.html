<!DOCTYPE html>
<html>
<head>
    <title>GNIOT Helpdesk Bot</title>
    <style>
        body{font-family:sans-serif; background:#f5f5f5; padding:20px; max-width:800px; margin:auto}
        h2{color:#003366; text-align:center}
        #chat{background:white; border:1px solid #ccc; border-radius:8px; height:600px; overflow-y:scroll; padding:10px; margin-bottom:10px}
        p{margin:5px 0}
        input{width:75%; padding:10px; border:1px solid #ccc; border-radius:5px}
        button{width:20%; padding:10px; background:#003366; color:white; border:none; border-radius:5px; cursor:pointer}
        b{color:#003366}
    </style>
<script src="https://unpkg.com/ibmcloud-appid-js@latest/dist/appid.min.js"></script>
</head>
<body>
<div id="authBox" style="text-align:right; padding:10px;">
  <button id="loginBtn" style="background:#0f62fe; color:white; padding:8px;">Login</button>
  <button id="logoutBtn" style="background:red; color:white; padding:8px; display:none;">Logout</button>
  <span id="userEmail"></span>
</div>

<div id="chatContainer" style="display:none;">
    <div style="text-align: center; padding: 10px;">
        <img src="/IMAGES/logo.jpeg" alt="GNIOT Logo" width="200">
    </div>
    <h2>GNIOT Helpdesk Bot 🚔</h2>
    <div id="chat"></div>
    <input id="msg" placeholder="Message">
    <button onclick="send()">Send</button>
<script>
const appId = new IBMCloudAppID();

// Teri IBM IDs
const config = {
    clientId: "12e32b65-099f-47af-817f-e4e1ad01dadf",
    discoveryEndpoint: "https://au-syd.appid.cloud.ibm.com/oauth/v4/6c7af665-6c37-440a-802d-2ff58ebb21bc/.well-known/openid-configuration",
    redirectUri: "https://gniot-sanskar.github.io/gniot-chatbot-demo"
};

// IMPORTANT: init ka wait karo
appId.init(config).then(() => {
    console.log("AppID Initialized ✅");

    // Button kaam ab yaha lagega
    document.getElementById('loginBtn').onclick = () => appId.signin();
    document.getElementById('logoutBtn').onclick = () => { appId.signout(); location.reload(); };

    // Login check
    appId.getUserInfo().then(user => {
        if(user) {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('userEmail').innerText = 'Hi ' + user.email;
            document.getElementById('chatContainer').style.display = 'block'; // chatbot on
        }
    });

}).catch(err => {
    console.error("AppID Init Error:", err);
    alert("Login setup failed. Console me error dekh");
});

// TERA PURANA CHATBOT WALA FUNCTION
async function send(){
    let m = document.getElementById('msg').value;
    if(m.trim() === "") return;
    document.getElementById('chat').innerHTML += `<p><b>YOU:</b> ${m}</p>`;
    document.getElementById('msg').value = '';
    let r = await fetch('/chat',{method: 'POST',headers:{'Content-Type': 'application/json'},body:JSON.stringify({message:m})});
    let data = await r.json();
    document.getElementById('chat').innerHTML += `<p><b>BOT:</b> ${data.reply}</p>`;
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

document.getElementById('msg').addEventListener("keypress", function(event) {
    if (event.key === "Enter") send();
});
</script></div>
</body>
</html>
