<!DOCTYPE html>
<html>

</head>
<body>
  <h1>Welcome to GNIOT Chatbot</h1>
  <img src="/IMAGES/logo.jpeg" alt="GNIOT Logo" width="200">
  <script>
  window.watsonAssistantChatOptions = {
    integrationID: "6b0e239d-46fa-48c3-b11a-4dc96b938dcd",

    serviceInstanceID: "846b4021-97d4-4eb4-a410-3886f9207b79",

    document.head.appendChild(t);
  });
</script>
